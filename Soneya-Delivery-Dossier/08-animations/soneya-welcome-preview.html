<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Soneya – Page d'accueil animée</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=Manrope:wght@800&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;background:#EEF2FB}
#stage{max-width:430px;margin:0 auto;box-shadow:0 0 60px rgba(31,58,138,.25)}
#replay{position:fixed;top:12px;right:12px;z-index:5;border:0;border-radius:20px;padding:10px 16px;background:#fff;color:#1F3A8A;font:700 14px 'DM Sans',sans-serif;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.18)}
/* Soneya – page d'accueil animée. Animations 100 % CSS, légères pour mobile. */
.welcome{position:relative;min-height:100dvh;overflow:hidden;background:#1F3A8A;color:#fff;font-family:'DM Sans',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:18dvh 28px 32px;box-sizing:border-box}
.welcome *{box-sizing:border-box}
.welcome .orb{position:absolute;border-radius:50%;background:#2B4BA3;animation:drift 14s ease-in-out infinite alternate}
.welcome .orb.a{width:420px;height:420px;right:-160px;top:-140px}
.welcome .orb.b{width:360px;height:360px;left:-140px;bottom:-120px;animation-delay:-5s}
.welcome .plate{position:absolute;border-radius:50%;background-size:cover;background-position:center;border:6px solid rgba(255,255,255,.92);box-shadow:0 18px 40px rgba(8,12,40,.35);opacity:0;animation:plateIn .9s cubic-bezier(.2,1.2,.4,1) forwards,float 6s ease-in-out infinite alternate}
.welcome .plate.p1{width:200px;height:200px;left:-60px;top:58%;animation-delay:2.6s,3.5s}
.welcome .plate.p2{width:150px;height:150px;right:-44px;top:9%;animation-delay:2.9s,4s}
.welcome .plate.p3{width:96px;height:96px;left:22px;top:8%;animation-delay:3.2s,4.5s}
.welcome .logo{position:relative;width:112px;height:112px;border-radius:28px;background:#fff center/cover no-repeat;box-shadow:0 20px 44px rgba(8,12,40,.4);opacity:0;animation:logoIn .9s cubic-bezier(.2,1.4,.4,1) .2s forwards}
.welcome .logo::after{content:"";position:absolute;inset:-10px;border-radius:36px;border:2px solid rgba(255,255,255,.55);opacity:0;animation:ring 2.4s ease-out 1.1s 2}
.welcome h1{margin:28px 0 0;font:800 clamp(28px,8vw,36px)/1.1 'Manrope','DM Sans',sans-serif;text-align:center;opacity:0;animation:titleIn .9s ease 1.7s forwards}
.welcome .slogans{position:relative;width:100%;max-width:340px;height:92px;margin:18px 0 0;padding:0;list-style:none}
.welcome .slogan{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;text-align:center;font-size:18px;line-height:1.4;color:#DCE3F4;opacity:0;animation:slogan 12s ease infinite both;animation-delay:calc(2.6s + var(--i)*3s)}
.welcome .dots{display:flex;gap:8px;margin-top:6px;opacity:0;animation:fade .6s ease 2.6s forwards}
.welcome .dot{width:8px;height:8px;border-radius:4px;background:rgba(255,255,255,.35);animation:dot 12s ease infinite both;animation-delay:calc(2.6s + var(--i)*3s)}
.welcome .cta{position:absolute;left:24px;right:24px;bottom:calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;opacity:0;animation:rise .8s ease 3.2s forwards}
.welcome .btn{height:56px;border-radius:18px;border:0;font:700 17px 'DM Sans',sans-serif;cursor:pointer;transition:transform .15s ease}
.welcome .btn:active{transform:scale(.97)}
.welcome .btn.primary{background:#D8432F;color:#fff}
.welcome .btn.ghost{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.7)}
@keyframes logoIn{from{opacity:0;transform:scale(.4) rotate(-8deg)}to{opacity:1;transform:scale(1) rotate(0)}}
@keyframes ring{0%{opacity:.8;transform:scale(.92)}100%{opacity:0;transform:scale(1.35)}}
@keyframes titleIn{from{opacity:0;transform:translateY(18px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes slogan{0%{opacity:0;transform:translateY(16px)}4%{opacity:1;transform:none}21%{opacity:1;transform:none}25%{opacity:0;transform:translateY(-16px)}100%{opacity:0}}
@keyframes dot{0%{background:rgba(255,255,255,.35);width:8px}3%{background:#fff;width:24px}22%{background:#fff;width:24px}25%{background:rgba(255,255,255,.35);width:8px}100%{background:rgba(255,255,255,.35);width:8px}}
@keyframes plateIn{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
@keyframes float{from{translate:0 0}to{translate:0 -14px}}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(-30px,24px)}}
@keyframes fade{to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .welcome *{animation:none!important}
  .welcome .logo,.welcome h1,.welcome .cta,.welcome .plate,.welcome .dots{opacity:1}
  .welcome .slogan:first-child{opacity:1}
}
</style></head><body>
