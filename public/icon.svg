<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B7A4B" />
      <stop offset="100%" stop-color="#064E30" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#grad)" />
  <!-- Accent Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#FFB81F" stroke-width="8" stroke-dasharray="16 12" opacity="0.3" />
  <!-- Scooter / Delivery Icon in Saffron & White -->
  <g transform="translate(100, 110) scale(0.62)" filter="url(#shadow)">
    <!-- Helmet / Rider -->
    <circle cx="270" cy="90" r="45" fill="#FFB81F" />
    <!-- Scooter Body -->
    <path d="M 120 340 L 220 340 L 290 220 L 370 220 L 390 140" fill="none" stroke="#FFFFFF" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Rear cargo box (Soneya Delivery Box) -->
    <rect x="110" y="150" width="120" height="110" rx="20" fill="#FFB81F" />
    <path d="M 140 205 L 200 205 M 170 175 L 170 235" stroke="#0B7A4B" stroke-width="12" stroke-linecap="round" />
    <!-- Front wheel -->
    <circle cx="390" cy="340" r="55" fill="none" stroke="#FFFFFF" stroke-width="34" />
    <circle cx="390" cy="340" r="20" fill="#FFB81F" />
    <!-- Rear wheel -->
    <circle cx="120" cy="340" r="55" fill="none" stroke="#FFFFFF" stroke-width="34" />
    <circle cx="120" cy="340" r="20" fill="#FFB81F" />
    <!-- Motion lines -->
    <path d="M 20 220 L 70 220 M 10 260 L 60 260 M 30 180 L 80 180" stroke="#FFB81F" stroke-width="14" stroke-linecap="round" />
  </g>
  <!-- Text Brand at bottom -->
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">SONEYA</text>
</svg>
