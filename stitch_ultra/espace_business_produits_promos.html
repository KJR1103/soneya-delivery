  <link href="https://fonts.googleapis.com/css2?family=Playfair:wght@700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Spline+Sans+Mono:wght@500;600&amp;display=swap" rel="stylesheet">

<body class="bg-light-surface dark:bg-dark-surface text-light-on-surface dark:text-dark-on-surface font-body antialiased">
  <div class="min-h-[1024px] flex flex-col" data-stitch-vh="min-h-[1024px]===min-h-screen">
    <header class="sticky top-0 z-30 bg-light-surface-container-low/95 backdrop-blur-md border-b border-light-outline">
      <div class="max-w-7xl mx-auto px-gutter-md md:px-gutter-lg py-gutter-md flex items-center justify-between gap-gutter-md">
        <div class="flex items-center gap-gutter-md">
          <span class="inline-flex items-center justify-center w-10 h-10 rounded-md bg-partner text-on-partner">
            <span class="material-symbols-outlined text-title-lg" aria-hidden="true">storefront</span>
          </span>
          <div>
            <span data-design-text-token="title-md" class="font-title text-title-md text-light-on-surface block">Chez Fanta · Catalogue</span>
            <span data-design-text-token="label-sm" class="font-label text-label-sm text-light-on-surface-variant">Articles, photos &amp; codes promo</span>
          </div>
        </div>
        <a href="#dashboard" class="px-gutter-md py-2 rounded-md bg-light-surface-container border border-light-outline font-label text-label-md text-light-on-surface">
          <span data-design-text-token="label-md">Retour bilan</span>
        </a>
      </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-gutter-md md:px-gutter-lg py-gutter-xl grid grid-cols-1 lg:grid-cols-12 gap-gutter-xl items-start">
      <!-- Left: Create Product / Article -->
      <section class="lg:col-span-7 p-gutter-lg rounded-lg bg-light-surface-container-low border border-light-outline shadow-sm flex flex-col gap-gutter-lg">
        <h1 data-design-text-token="headline-md" class="font-headline text-headline-md text-light-on-surface">Ajouter un produit ou article</h1>

        <!-- Photo Upload Box -->
        <div class="p-gutter-lg rounded-lg bg-light-surface-container border border-dashed border-light-outline flex flex-col items-center justify-center gap-gutter-sm text-center">
          <img src="https://lh3.googleusercontent.com/aida/ALJJyrDnokUuTLr-3l9vcS9ozchfhDN6Gj60eXrukGqR5Z-mzNSA3zDJTByndiDA7Q5ybD-i0wVlO-C4KMgwyD2LeZ9ETsDBfdBVGKKBImsgY2iV307XeXfk5CKow6YE1e8lP9f_TL2rlDWJUrTKucnFtqvrbv74fofuwi8qZF0G4_WShgtoHWlNnjuI2gmDWrlNhXOs1Mqp9pQc_101o2dWHw4HKsuoBx2EUIgy3Achl8tJmasKg8vdEcJF" alt="Aperçu produit" class="w-28 h-20 object-cover rounded-md">
          <p data-design-text-token="title-md" class="font-title text-title-md text-light-on-surface">Photo haute définition du plat</p>
          <button type="button" class="px-gutter-md py-1.5 rounded-md bg-light-primary-container text-light-primary font-label text-label-md">
            <span data-design-text-token="label-md">Changer la photo</span>
          </button>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-gutter-md">
          <div class="flex flex-col gap-gutter-xs">
            <label for="prod-name" data-design-text-token="label-md" class="font-label text-label-md text-light-on-surface">Nom de l&#39;article</label>
            <input id="prod-name" type="text" value="Maffé Tiga au Bœuf Fumé" class="w-full px-gutter-md py-2.5 rounded-md bg-light-surface-container border border-light-outline font-body text-body-md text-light-on-surface">
          </div>
          <div class="flex flex-col gap-gutter-xs">
            <label for="prod-price" data-design-text-token="label-md" class="font-label text-label-md text-light-on-surface">Prix (GNF)</label>
            <input id="prod-price" type="text" value="45 000" class="w-full px-gutter-md py-2.5 rounded-md bg-light-surface-container border border-light-outline font-mono text-mono-md text-light-on-surface">
          </div>
        </div>

        <div class="flex flex-col gap-gutter-xs">
          <label for="prod-desc" data-design-text-token="label-md" class="font-label text-label-md text-light-on-surface">Description</label>
          <textarea id="prod-desc" rows="3" class="w-full px-gutter-md py-2.5 rounded-md bg-light-surface-container border border-light-outline font-body text-body-md text-light-on-surface">Sauce onctueuse à la pâte d&#39;arachide de Kindia, bœuf fumé tendre et riz blanc parfumé.</textarea>
        </div>

        <!-- COMPONENT: button-primary -->
        <button data-component-id="button-primary" data-component-type="button" data-component-variant="primary" type="button" class="self-start inline-flex items-center justify-center gap-gutter-sm px-gutter-lg py-3 rounded-md bg-light-primary text-light-on-primary font-label text-label-lg hover:opacity-90">
          <span data-design-text-token="label-lg">Publier l&#39;article</span>
        </button>
      </section>

      <!-- Right: Create Discount / Promo Code -->
      <section class="lg:col-span-5 flex flex-col gap-gutter-lg">
        <div class="p-gutter-lg rounded-lg bg-light-surface-container-low border border-light-outline shadow-sm flex flex-col gap-gutter-md">
          <h2 data-design-text-token="title-lg" class="font-title text-title-lg text-light-on-surface">Créer une remise / Code Promo</h2>

          <div class="flex flex-col gap-gutter-xs">
            <label for="promo-code" data-design-text-token="label-md" class="font-label text-label-md text-light-on-surface">Code promo</label>
            <input id="promo-code" type="text" placeholder="Ex : FANTA15" class="w-full px-gutter-md py-2.5 rounded-md bg-light-surface-container border border-light-outline font-mono text-mono-md text-light-on-surface uppercase">
          </div>

          <div class="grid grid-cols-2 gap-gutter-md">
            <div class="flex flex-col gap-gutter-xs">
              <label for="promo-val" data-design-text-token="label-md" class="font-label text-label-md text-light-on-surface">Réduction</label>
              <input id="promo-val" type="text" value="15 %" class="w-full px-gutter-md py-2.5 rounded-md bg-light-surface-container border border-light-outline font-mono text-mono-md text-light-on-surface">
            </div>
            <div class="flex flex-col gap-gutter-xs">
              <label for="promo-min" data-design-text-token="label-md" class="font-label text-label-md text-light-on-surface">Panier min.</label>
              <input id="promo-min" type="text" value="60 000 GNF" class="w-full px-gutter-md py-2.5 rounded-md bg-light-surface-container border border-light-outline font-mono text-mono-md text-light-on-surface">
            </div>
          </div>

          <button type="button" class="w-full px-gutter-lg py-3 rounded-md bg-light-primary-container text-light-primary font-label text-label-lg hover:bg-light-surface-variant">
            <span data-design-text-token="label-lg">Activer le code promo</span>
          </button>
        </div>

        <!-- Active Promos List -->
        <div class="p-gutter-lg rounded-lg bg-light-surface-container-low border border-light-outline shadow-sm flex flex-col gap-gutter-sm">
          <h3 data-design-text-token="title-md" class="font-title text-title-md text-light-on-surface">Promos actives</h3>
          <div class="p-gutter-md rounded-md bg-light-primary-container flex items-center justify-between">
            <div>
              <span data-design-text-token="mono-md" class="font-mono text-mono-md text-light-primary block">FANTA15</span>
              <span data-design-text-token="body-sm" class="font-body text-body-sm text-light-on-surface-variant">-15% dès 60 000 GNF</span>
            </div>
            <span data-design-text-token="label-sm" class="px-2.5 py-0.5 rounded-full bg-light-primary text-light-on-primary font-label text-label-sm">Actif</span>
          </div>
        </div>
      </section>
    </main>
  </div>


</body></html>
