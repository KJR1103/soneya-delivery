  <link href="https://fonts.googleapis.com/css2?family=Playfair:wght@700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Spline+Sans+Mono:wght@500;600&amp;display=swap" rel="stylesheet">

<body class="bg-light-surface dark:bg-dark-surface text-light-on-surface dark:text-dark-on-surface font-body antialiased">
  <div class="min-h-[884px] flex flex-col" data-stitch-vh="min-h-[884px]===min-h-screen">
    <!-- Hero Launch Banner -->
    <div class="relative h-48 w-full overflow-hidden">
      <img src="https://lh3.googleusercontent.com/aida/ALJJyrDOVbyCG7iDk1IqvVsS3i9m3bqn_yDySv4ygE4Mo59SXzlDAQpJv_kquFGVRLcdpgs51hz7PdjG6t_2FS44qtBZQ9GRAscCnB0AC9XRcptw9UB4jijVXD_FtOn3n0yHcUzqeOeNFzla-4169GT5FD7wsqef3RfIjjFeuN7_Fbt3ysP5UgrVyL_rG0sALBcukd4SY3nKwn6DiesytRju-ZF6u6ENcATvEXWeqWntTnUc77gni6-34Kc4yDoCpFJLKg" alt="Bienvenue sur Soneya Delivery Conakry" class="w-full h-full object-cover">
      <div class="absolute inset-0 bg-gradient-to-t from-dark-surface/90 via-dark-surface/40 to-transparent flex flex-col justify-end p-gutter-md">
        <span data-design-text-token="label-sm" class="self-start px-3 py-1 rounded-full bg-accent text-on-accent font-label text-label-sm mb-1">Bienvenue à Conakry</span>
        <h1 data-design-text-token="display-md-mobile" class="font-display text-display-md-mobile text-light-on-primary">Créez votre espace Soneya</h1>
      </div>
    </div>

    <main class="flex-1 px-gutter-md py-gutter-lg flex flex-col gap-gutter-lg">
      <!-- Step 1: Choose Public Space (Client, Rider, Business — zero Admin) -->
      <section class="flex flex-col gap-gutter-sm">
        <h2 data-design-text-token="title-md" class="font-title text-title-md text-light-on-surface">1. Choisissez votre profil</h2>
        <div class="grid grid-cols-3 gap-gutter-sm">
          <button type="button" class="p-gutter-sm rounded-lg bg-light-primary-container border-2 border-light-primary text-light-primary flex flex-col items-center gap-1">
            <span class="material-symbols-outlined text-title-lg" aria-hidden="true">shopping_bag</span>
            <span data-design-text-token="label-md" class="font-label text-label-md">Client</span>
          </button>
          <button type="button" class="p-gutter-sm rounded-lg bg-light-surface-container-low border border-light-outline text-light-on-surface flex flex-col items-center gap-1">
            <span class="material-symbols-outlined text-title-lg text-courier" aria-hidden="true">two_wheeler</span>
            <span data-design-text-token="label-md" class="font-label text-label-md">Rider</span>
          </button>
          <button type="button" class="p-gutter-sm rounded-lg bg-light-surface-container-low border border-light-outline text-light-on-surface flex flex-col items-center gap-1">
            <span class="material-symbols-outlined text-title-lg text-partner" aria-hidden="true">storefront</span>
            <span data-design-text-token="label-md" class="font-label text-label-md">Business</span>
          </button>
        </div>
      </section>

      <!-- Step 2: Choose Category -->
      <section class="flex flex-col gap-gutter-sm">
        <h2 data-design-text-token="title-md" class="font-title text-title-md text-light-on-surface">2. Catégorie préférée</h2>
        <div class="flex flex-wrap gap-gutter-sm">
          <button type="button" class="px-gutter-md py-2 rounded-full bg-light-primary text-light-on-primary font-label text-label-md">
            <span data-design-text-token="label-md">Restaurants</span>
          </button>
          <button type="button" class="px-gutter-md py-2 rounded-full bg-light-surface-container-low border border-light-outline text-light-on-surface font-label text-label-md">
            <span data-design-text-token="label-md">Supermarché</span>
          </button>
          <button type="button" class="px-gutter-md py-2 rounded-full bg-light-surface-container-low border border-light-outline text-light-on-surface font-label text-label-md">
            <span data-design-text-token="label-md">Pharmacie</span>
          </button>
          <button type="button" class="px-gutter-md py-2 rounded-full bg-light-surface-container-low border border-light-outline text-light-on-surface font-label text-label-md">
            <span data-design-text-token="label-md">Colis Express</span>
          </button>
        </div>
      </section>

      <!-- Step 3: Account Details (Gmail / Apple + Mobile Validation) -->
      <form class="flex flex-col gap-gutter-md">
        <h2 data-design-text-token="title-md" class="font-title text-title-md text-light-on-surface">3. Connexion &amp; validation mobile</h2>

        <div class="grid grid-cols-2 gap-gutter-sm">
          <button type="button" class="inline-flex items-center justify-center gap-gutter-xs px-gutter-md py-2.5 rounded-md bg-light-surface-container-low border border-light-outline text-light-on-surface font-label text-label-md hover:bg-light-surface-container">
            <span class="material-symbols-outlined text-title-md" aria-hidden="true">mail</span>
            <span data-design-text-token="label-md">Gmail</span>
          </button>
          <button type="button" class="inline-flex items-center justify-center gap-gutter-xs px-gutter-md py-2.5 rounded-md bg-light-surface-container-low border border-light-outline text-light-on-surface font-label text-label-md hover:bg-light-surface-container">
            <span class="material-symbols-outlined text-title-md" aria-hidden="true">phone_iphone</span>
            <span data-design-text-token="label-md">Apple</span>
          </button>
        </div>

        <div class="flex flex-col gap-gutter-xs">
          <label for="fullname" data-design-text-token="label-md" class="font-label text-label-md text-light-on-surface">Nom complet</label>
          <input id="fullname" type="text" placeholder="Ex : Mamadou Diallo" class="w-full px-gutter-md py-3 rounded-md bg-light-surface-container-low border border-light-outline font-body text-body-md text-light-on-surface focus:border-light-primary focus:ring-0">
        </div>
        <div class="flex flex-col gap-gutter-xs">
          <label for="phone" data-design-text-token="label-md" class="font-label text-label-md text-light-on-surface">Numéro mobile à valider (+224)</label>
          <div class="flex items-center gap-gutter-xs">
            <input id="phone" type="tel" placeholder="+224 622 00 00 00" class="w-full px-gutter-md py-3 rounded-md bg-light-surface-container-low border border-light-outline font-mono text-mono-md text-light-on-surface focus:border-light-primary focus:ring-0">
            <button type="button" class="shrink-0 px-gutter-md py-3 rounded-md bg-light-primary-container text-light-primary font-label text-label-md">
              <span data-design-text-token="label-md">Code SMS</span>
            </button>
          </div>
          <span data-design-text-token="body-sm" class="font-body text-body-sm text-light-on-surface-variant">Obligatoire après Gmail ou Apple pour sécuriser vos livraisons.</span>
        </div>
        <div class="flex flex-col gap-gutter-xs">
          <label for="quartier" data-design-text-token="label-md" class="font-label text-label-md text-light-on-surface">Quartier à Conakry</label>
          <select id="quartier" class="w-full px-gutter-md py-3 rounded-md bg-light-surface-container-low border border-light-outline font-body text-body-md text-light-on-surface focus:border-light-primary focus:ring-0">
            <option>Kipé</option>
            <option>Kaloum / Almamya</option>
            <option>Ratoma</option>
            <option>Lambanyi</option>
          </select>
        </div>

        <!-- COMPONENT: button-primary -->
        <button data-component-id="button-primary" data-component-type="button" data-component-variant="primary" type="submit" class="w-full inline-flex items-center justify-center gap-gutter-sm px-gutter-lg py-3.5 rounded-md bg-light-primary text-light-on-primary font-label text-label-lg hover:opacity-90 mt-2">
          <span data-design-text-token="label-lg">Créer mon compte</span>
        </button>
      </form>
    </main>
  </div>


</body></html>
